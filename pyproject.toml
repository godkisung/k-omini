[project]
name = "k-omini"
version = "0.1.0"
description = "K-Omnidoc Duplication Filtering & Analysis Engine"
readme = "README.md"
authors = [
    { name = "kisung", email = "kisung@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "beautifulsoup4>=4.14.3",
    "easyocr>=1.7.2",
    "einops>=0.8.2",
    "huggingface-hub==0.36.2",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "milvus-lite>=2.5.1",
    "onnxruntime>=1.24.4",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.1.1",
    "pylatexenc>=2.10",
    "pymilvus>=2.6.10",
    "python-levenshtein>=0.27.3",
    "rich>=14.3.3",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "streamlit>=1.55.0",
    "streamlit-drawable-canvas>=0.9.3",
    "streamlit-image-coordinates>=0.4.0",
    "streamlit-shortcuts>=1.2.1",
    "timm>=1.0.26",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers<4.45.0",
    "typer>=0.24.1",
]

# torch==2.5.1(cu121)로 고정하는 이유: 최신 torch(cu13 계열)는 컴파일된 CUDA 커널에서
# Pascal(SM 6.1, 예: GTX 1080 Ti)을 아예 제외해 GPU에서 "no kernel image" 에러로
# 실패한다. cu121 인덱스의 마지막 버전인 2.5.1까지는 sm_60이 arch list에 포함되어
# Pascal GPU에서 정상 동작한다 (src/core/ocr_engine.py의 legacy GPU cuDNN 우회 참고).
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
